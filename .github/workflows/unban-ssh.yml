name: Unban SSH IP

on:
  workflow_dispatch:
    inputs:
      ip:
        description: "IP publique à débannir (IPv4)"
        required: true
        type: string

concurrency:
  group: unban-ssh
  cancel-in-progress: false

jobs:
  unban:
    name: Diagnostiquer et débannir
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Unban + diagnostic SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          request_pty: true
          command_timeout: 2m
          script: |
            set -euo pipefail
            IP='${{ inputs.ip }}'
            PASS='${{ secrets.VPS_SUDO_PASSWORD }}'
            if [[ ! "$IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
              echo "IP invalide: $IP"
              exit 1
            fi
            if [[ -z "$PASS" ]]; then
              echo "Secret VPS_SUDO_PASSWORD absent. Ajoute-le : Settings > Secrets and variables > Actions."
              exit 1
            fi
            run_sudo() { printf '%s\n' "$PASS" | sudo -S -p '' -- "$@"; }
            echo "=== id ==="
            id
            echo "=== ports (sans sudo) ==="
            ss -tln 2>/dev/null | grep -E ':22|:2222|ssh' || true
            echo "=== sudo whoami ==="
            run_sudo whoami
            echo "=== sshd listen ==="
            run_sudo ss -tlnp | grep -E 'ssh|sshd' || true
            echo "=== fail2ban ==="
            if run_sudo fail2ban-client status; then
              run_sudo fail2ban-client status sshd || true
              echo "--- unban $IP ---"
              run_sudo fail2ban-client set sshd unbanip "$IP" || true
              run_sudo fail2ban-client unban "$IP" || true
              run_sudo fail2ban-client status sshd || true
            else
              echo "fail2ban-client a echoue"
            fi
            echo "=== ufw / iptables / nft (IP) ==="
            run_sudo ufw status || true
            run_sudo iptables -L INPUT -n -v | grep -F "$IP" || true
            run_sudo nft list ruleset | grep -F "$IP" || true
            echo "=== done ==="
