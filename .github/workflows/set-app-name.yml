name: Set APP_NAME Shifti

on:
  workflow_dispatch:

concurrency:
  group: set-app-name
  cancel-in-progress: false

jobs:
  update:
    name: Mettre APP_NAME=Shifti
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Patch .env + recreate app
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            NEW="${{ secrets.VPS_APP_PATH }}"
            cd "$NEW"
            [[ -f .env ]] || { echo "ERREUR: .env introuvable"; exit 1; }

            echo "Avant:"
            grep -E '^APP_NAME=' .env || echo "(absent)"

            if grep -qE '^APP_NAME=' .env; then
              sed -i -E 's/^APP_NAME=.*/APP_NAME=Shifti/' .env
            else
              printf '\nAPP_NAME=Shifti\n' >> .env
            fi

            echo "Après:"
            grep -E '^APP_NAME=' .env

            # Recreate pour recharger env_file
            docker compose up -d --force-recreate app

            for i in $(seq 1 60); do
              status="$(docker inspect -f '{{.State.Health.Status}}' planning_app 2>/dev/null || echo starting)"
              [[ "$status" == "healthy" ]] && { echo "app healthy"; break; }
              [[ "$i" -eq 60 ]] && { echo "timeout health=$status"; exit 1; }
              sleep 2
            done

            echo "OK APP_NAME=Shifti"
