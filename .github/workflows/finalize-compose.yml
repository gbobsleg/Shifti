name: Finalize Compose project name

on:
  workflow_dispatch:

concurrency:
  group: finalize-compose
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Forcer COMPOSE_PROJECT_NAME=shifti
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_PATH }}"
            git pull --ff-only origin main
            if grep -qE '^COMPOSE_PROJECT_NAME=' .env; then
              sed -i -E 's/^COMPOSE_PROJECT_NAME=.*/COMPOSE_PROJECT_NAME=shifti/' .env
            else
              printf '\nCOMPOSE_PROJECT_NAME=shifti\n' >> .env
            fi
            export COMPOSE_PROJECT_NAME=shifti
            echo "COMPOSE_PROJECT_NAME in .env:"
            grep '^COMPOSE_PROJECT_NAME=' .env
            docker compose -p planning_new down --remove-orphans 2>/dev/null || true
            docker compose down --remove-orphans 2>/dev/null || true
            docker rm -f shifti_app shifti_db planning_new-adminer-1 shifti-adminer-1 2>/dev/null || true
            docker compose build app
            docker compose up -d
            for i in $(seq 1 60); do
              status="$(docker inspect -f '{{.State.Health.Status}}' shifti_app 2>/dev/null || echo starting)"
              [[ "$status" == "healthy" ]] && break
              [[ "$i" -eq 60 ]] && exit 1
              sleep 2
            done
            curl -s -o /dev/null -w 'smoke=%{http_code}\n' --max-time 15 http://127.0.0.1:8080/
            docker compose ps
            docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'shifti|planning' || true
            echo "OK project=shifti"
