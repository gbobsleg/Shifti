name: Check VPS APP_NAME

on:
  workflow_dispatch:

concurrency:
  group: check-vps-app-name
  cancel-in-progress: false

jobs:
  check:
    name: Cancel stuck Optuna job
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel running prophet_tuning_jobs
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            APP_PATH="${{ secrets.VPS_APP_PATH }}"
            cd "$APP_PATH"
            MYSQL_USER="$(docker compose exec -T db printenv MYSQL_USER | tr -d '\r')"
            MYSQL_PASSWORD="$(docker compose exec -T db printenv MYSQL_PASSWORD | tr -d '\r')"
            MYSQL_DATABASE="$(docker compose exec -T db printenv MYSQL_DATABASE | tr -d '\r')"
            echo "DB user=$MYSQL_USER db=$MYSQL_DATABASE"
            echo "=== BEFORE ==="
            docker compose exec -T db mariadb -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "
            SELECT id, offer_id, status, progress_trials_done, progress_trials_total,
                   started_at, finished_at, LEFT(IFNULL(error_message,''), 120) AS err
            FROM prophet_tuning_jobs
            WHERE status IN ('running','queued')
            ORDER BY id;
            "
            echo "=== CANCEL ==="
            docker compose exec -T db mariadb -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "
            UPDATE prophet_tuning_jobs
            SET status = 'cancelled',
                finished_at = NOW(),
                error_message = 'Annulé manuellement (worker interrompu par deploy)',
                modified = NOW()
            WHERE status = 'running';
            SELECT ROW_COUNT() AS rows_updated;
            "
            echo "=== AFTER ==="
            docker compose exec -T db mariadb -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "
            SELECT id, offer_id, status, progress_trials_done, progress_trials_total,
                   started_at, finished_at, LEFT(IFNULL(error_message,''), 120) AS err
            FROM prophet_tuning_jobs
            ORDER BY id DESC
            LIMIT 5;
            "
            echo "=== SUPERVISOR ==="
            docker compose exec -T app supervisorctl status python-prophet-tuning 2>/dev/null || true
