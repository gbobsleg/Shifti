name: Check VPS APP_NAME

on:
  workflow_dispatch:

concurrency:
  group: check-vps-app-name
  cancel-in-progress: false

jobs:
  check:
    name: Read APP_NAME
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Grep APP_NAME on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            APP_PATH="${{ secrets.VPS_APP_PATH }}"
            echo "APP_PATH=$APP_PATH"
            cd "$APP_PATH"
            echo "PWD=$(pwd)"
            echo "HEAD=$(git rev-parse --short HEAD 2>/dev/null || echo n/a)"
            if [[ -f .env ]]; then
              echo "--- .env APP_NAME ---"
              grep -E '^[[:space:]]*APP_NAME=' .env || echo "APP_NAME=(absent)"
            else
              echo ".env absent"
            fi
            # Valeur effective dans le conteneur app (si stack up)
            if docker compose ps --status running --services 2>/dev/null | grep -qx app; then
              echo "--- container app env ---"
              docker compose exec -T app printenv APP_NAME 2>/dev/null || echo "APP_NAME=(unset in container)"
            else
              echo "container app not running (or compose unavailable)"
            fi
