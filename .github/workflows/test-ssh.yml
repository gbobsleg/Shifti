name: Test SSH

on:
  workflow_dispatch:

concurrency:
  group: test-ssh
  cancel-in-progress: false

jobs:
  test:
    name: Vérifier la connexion SSH
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH ping
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            echo "SSH OK"
            echo "user=$(whoami)"
            echo "host=$(hostname)"
            echo "home=$HOME"
            echo "--- listing home ---"
            ls -la "$HOME" || true
            echo "--- docker compose files ---"
            find "$HOME" -maxdepth 3 -name docker-compose.yml 2>/dev/null || true
