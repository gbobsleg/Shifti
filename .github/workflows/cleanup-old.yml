name: Cleanup Planning_new_old

on:
  workflow_dispatch:

concurrency:
  group: cleanup-old
  cancel-in-progress: false

jobs:
  cleanup:
    name: Supprimer Planning_new_old
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: rm -rf Planning_new_old
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            OLD_BAK="$HOME/Planning_new_old"
            if [[ ! -d "$OLD_BAK" ]]; then
              echo "Déjà absent: $OLD_BAK"
              ls -la "$HOME" || true
              exit 0
            fi
            echo "Suppression de $OLD_BAK (contenus root via Docker)..."
            # Les logs créés par le conteneur app sont root:root → rm user impossible
            docker run --rm -v "$OLD_BAK:/wipe" alpine:3.20 \
              sh -c 'rm -rf /wipe/..?* /wipe/.[!.]* /wipe/* 2>/dev/null || true'
            rm -rf -- "$OLD_BAK"
            [[ ! -e "$OLD_BAK" ]] || { echo "ERREUR: suppression incomplete"; ls -la "$OLD_BAK" || true; exit 1; }
            echo "OK supprimé"
            ls -la "$HOME"
