name: Docker prune legacy

on:
  workflow_dispatch:

concurrency:
  group: docker-prune
  cancel-in-progress: false

jobs:
  prune:
    name: Purger planning_new*
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Nettoyage Docker legacy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo "=== Avant ==="
            docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' || true
            docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.Size}}' || true
            docker network ls || true
            docker volume ls || true

            echo "=== Conteneurs legacy ==="
            docker ps -aq --filter name=planning_new | while read -r id; do
              [[ -n "$id" ]] || continue
              docker rm -f "$id" || true
            done

            echo "=== Images planning_new* ==="
            docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | grep -E '^planning_new' | while read -r ref id; do
              echo "rm $ref ($id)"
              docker image rm -f "$ref" 2>/dev/null || docker image rm -f "$id" || true
            done
            # au cas où tag dangling
            docker images -q --filter reference='planning_new-app*' | while read -r id; do
              [[ -n "$id" ]] || continue
              docker image rm -f "$id" || true
            done

            echo "=== Réseaux planning* (sauf shifti) ==="
            docker network ls --format '{{.Name}}' | grep -E 'planning' | grep -v shifti | while read -r n; do
              echo "rm network $n"
              docker network rm "$n" 2>/dev/null || true
            done

            echo "=== Volumes planning_new* ==="
            docker volume ls -q | grep -E '^planning_new' | while read -r v; do
              echo "rm volume $v"
              docker volume rm "$v" 2>/dev/null || true
            done

            echo "=== Après ==="
            docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
            docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.Size}}'
            docker network ls
            docker volume ls
            echo "SMOKE:"
            curl -s -o /dev/null -w '%{http_code}\n' --max-time 15 http://127.0.0.1:8080/ || true
            echo "OK prune"
