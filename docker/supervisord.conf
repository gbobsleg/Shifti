[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm.err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err.log

[program:python-solver]
command=/opt/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8000 --workers 1
directory=/var/www/html/solver-python
autostart=true
autorestart=true
priority=30
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/var/log/supervisor/solver.log
stderr_logfile=/var/log/supervisor/solver.err.log

[program:python-prophet]
command=/opt/venv/bin/uvicorn forecast_prophet:app --host 127.0.0.1 --port 8001 --workers 1
directory=/var/www/html/solver-python
autostart=true
autorestart=true
priority=30
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/var/log/supervisor/prophet.log
stderr_logfile=/var/log/supervisor/prophet.err.log

[program:cake-worker]
command=php /var/www/html/bin/cake.php planning_generation_worker
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/cake-worker.log
stderr_logfile=/var/log/supervisor/cake-worker.err.log

[program:cake-forecast-worker]
command=php /var/www/html/bin/cake.php forecast_scenario_worker
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/cake-forecast-worker.log
stderr_logfile=/var/log/supervisor/cake-forecast-worker.err.log
